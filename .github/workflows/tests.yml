name: Tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: "Test template ${{matrix.template}}"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        template: 
          - http_api
          - package
          - telegram_bot
    steps:
      - uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.1'
      - name: Display Go version
        run: go version
      - name: Install mockery
        run: go install github.com/vektra/mockery/v2@v2.53.3
      - name: Install Go Scaffold
        run: |
          go install github.com/go-scaffold/go-scaffold/cmd/go-scaffold@master
      - name: Build
        run: go-scaffold generate ${{matrix.template}} ${{matrix.template}}_test --values ./${{matrix.template}}/values.yaml 
      - name: Init Template
        run: "cd ${{matrix.template}}_test && make init"
      - name: Code Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a
        with:
          working-directory: "${{matrix.template}}_test/"
      - name: Tests
        run: "cd ${{matrix.template}}_test && make test"
      - name: Check if Dockerfile exists
        id: dockerfile-check
        run: |
          if [ -f "${{matrix.template}}_test/Dockerfile" ]; then
            echo "dockerfile_exists=true" >> $GITHUB_OUTPUT
          else
            echo "dockerfile_exists=false" >> $GITHUB_OUTPUT
          fi
      - name: Set up Docker Buildx
        if: steps.dockerfile-check.outputs.dockerfile_exists == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Build and push Docker image
        if: steps.dockerfile-check.outputs.dockerfile_exists == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: ${{matrix.template}}_test
          platforms: 'linux/amd64'
          build-args: |
            VERSION=dev
